name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: write # the package jobs add their own files to the release
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.ref_name }}
      release: true

  flatpak:
    name: ${{ matrix.arch }} — Flatpak
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # adds its file to the release
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Reuse the tar.gz built above instead of compiling twice.
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: staged
      - name: Stage the app for flatpak-builder
        run: |
          mkdir -p packaging/flatpak/dist
          tar -xzf staged/visage-*-linux-${{ matrix.arch }}.tar.gz -C packaging/flatpak/dist
          ls packaging/flatpak/dist/visage
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: VIsage-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.vndreiii.Visage.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: VIsage-${{ matrix.arch }}.flatpak
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release-upload.sh "$TAG" VIsage-${{ matrix.arch }}.flatpak

  libmpv:
    # The app downloads this bundle on first start when the system has no libmpv.
    name: ${{ matrix.arch }} — libmpv bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # adds its file to the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git meson ninja-build pkg-config patchelf nasm \
            python3 libssl-dev libass-dev libplacebo-dev libpulse-dev libasound2-dev
      - run: bash scripts/build-libmpv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.arch }}
          path: dist/visage-libmpv-linux-${{ matrix.arch }}.tar.gz
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release-upload.sh "$TAG" dist/visage-libmpv-linux-${{ matrix.arch }}.tar.gz

  publish:
    # The Flatpak job adds its own file when it is done; the manifest does not wait for it.
    needs: [build, libmpv]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # adds the manifest files and finishes the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write the Arch PKGBUILD for this release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          x86="$(sha256sum artifacts/visage-${version}-linux-x86_64.tar.gz | cut -d' ' -f1)"
          arm="$(sha256sum artifacts/visage-${version}-linux-aarch64.tar.gz | cut -d' ' -f1)"
          sed -e "s/@VERSION@/${version%%-*}/" -e "s/@SHA_X86_64@/$x86/" -e "s/@SHA_AARCH64@/$arm/" \
            packaging/arch/PKGBUILD.bin.in > artifacts/PKGBUILD
      - name: Build + sign the update manifest
        env:
          UPDATE_KEY: ${{ secrets.VISAGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cd artifacts
          # Self-updating builds: the AppImages and the Windows installer, plus the libmpv fallback bundles. The other formats open the release page.
          jq -n --arg version "$version" --arg date "$(date -u +%FT%TZ)" --arg notes "VIsage $version" '{version:$version, notes:$notes, pub_date:$date, assets:{}}' > ../latest.json
          for f in VIsage-x86_64.AppImage VIsage-aarch64.AppImage VIsage-x64.msi visage-libmpv-linux-x86_64.tar.gz visage-libmpv-linux-aarch64.tar.gz; do
            [[ -f "$f" ]] || continue
            jq --arg n "$f" --arg u "$base/$f" --arg h "$(sha256sum "$f" | cut -d' ' -f1)" --argjson s "$(stat -c %s "$f")" \
              '.assets[$n] = {url:$u, sha256:$h, size:$s}' ../latest.json > ../latest.tmp && mv ../latest.tmp ../latest.json
          done
          cd ..
          cat latest.json
          if [[ -z "$UPDATE_KEY" ]]; then
            echo "::warning::VISAGE_UPDATE_SIGNING_KEY is not set — releasing without latest.json.sig (clients will not auto-update)"
          else
            printf '%s' "$UPDATE_KEY" | base64 -d > key.pem
            openssl pkeyutl -sign -inkey key.pem -rawin -in latest.json | base64 -w0 > latest.json.sig
            shred -u key.pem
          fi
          mv latest.json artifacts/
          [[ -f latest.json.sig ]] && mv latest.json.sig artifacts/ || true
          cd artifacts && sha256sum * | grep -v SHA256SUMS > SHA256SUMS && ls -lh
      - name: Add the manifest files, then turn the pre-release into the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/ci-release-upload.sh "$TAG" artifacts/PKGBUILD artifacts/latest.json artifacts/SHA256SUMS $(ls artifacts/latest.json.sig 2>/dev/null || true)
          # The manifest is there now, so updaters may see this release. Tags with a "-" stay pre-releases.
          # Text of the release page: the "which file" table plus the generated changelog.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > changelog.md || : > changelog.md
          scripts/release-notes.sh "$TAG" changelog.md > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease -q '.isPrerelease, (.assets[] | .name)'
