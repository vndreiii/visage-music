name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Compile and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install runtime libraries used by tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libmpv2 libgl1 libxtst6 libxrender1 libxi6 fontconfig
      - name: Compile
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace
      - name: Test
        run: xvfb-run -a ./gradlew test --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  build:
    permissions:
      contents: write # build.yml can add files to a release; this run does not use it
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-ci
